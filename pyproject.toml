[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wnstatmech"]
exclude = ["tutorial*"]

[project]
name = "wnstatmech"
version = "1.2.0"
dependencies = ["scipy>=1.15", "numpy", "gslconsts"]
requires-python = ">=3.10"
authors = [
  {name = "Bradley S. Meyer", email = "mbradle@g.clemson.edu"},
  {name = "Lucas S. Walls", email = "lwalls@g.clemson.edu"},
]
maintainers = [
  {name = "Bradley S. Meyer", email = "mbradle@g.clemson.edu"},
]
description = "Package for handling the statistical mechanics of fermions and bosons"
readme = "README.rst"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E.*"]
keywords = ["astronomy, nuclear astrophysics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]

[project.optional-dependencies]
benchmark = ["pytest-benchmark>=5.1"]

[project.urls]
Documentation = "https://wnstatmech.readthedocs.org"
Repository = "https://github.com/mbradle/wnstatmech.git"
"Bug Tracker" = "https://github.com/mbradle/wnstatmech/issues"

[project.scripts]

[project.gui-scripts]

[project.entry-points."spam.magical"]

[tool.black]
line-length = 79
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.basic]
good-names = [
  "i",
  "j",
  "k",
  "ex",
  "Run",
  "_",
  "f",
  "x",
  "y",
  "x0",
  "x1",
  "x2",
  "f1",
  "f2",
]

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-attributes = 13
max-locals = 24
min-public-methods = 1

[tool.pylint."messages control"]
disable = ["duplicate-code"]
